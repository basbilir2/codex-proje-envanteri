<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>İki Sayıyı Topla</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .container {
      background-color: #fff;
      padding: 30px 40px;
      border-radius: 10px;
      box-shadow: 0 0 15px rgba(0,0,0,0.1);
      text-align: center;
    }
    h1 {
      margin-bottom: 20px;
      color: #333;
    }
    input[type="number"] {
      width: 100px;
      padding: 10px;
      margin: 10px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }
    button {
      padding: 10px 20px;
      font-size: 16px;
      background-color: #28a745;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    button:hover {
      background-color: #218838;
    }
    #sonuc {
      margin-top: 20px;
      font-size: 24px;
      color: #007bff;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>İki Sayıyı Topla</h1>
    <input type="number" id="sayi1" placeholder="Sayı 1">
    <input type="number" id="sayi2" placeholder="Sayı 2">
    <button onclick="topla()">Topla</button>
    <div id="sonuc"></div>
  </div>

  <script>
    function topla() {
      const sayi1 = parseFloat(document.getElementById("sayi1").value);
      const sayi2 = parseFloat(document.getElementById("sayi2").value);
      const sonuc = sayi1 + sayi2;
      document.getElementById("sonuc").innerText = "Sonuç: " + sonuc;
    }
  </script>
</body>
</html>
