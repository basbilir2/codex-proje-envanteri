[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lenticular2"
version = "2.0.0"
description = "Lenticular 2: Physically accurate lenticular optical calculations, DIBR synthesis, and prepress interlacing engine"
authors = [{ name = "Lenticular Team" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "opencv-python-headless>=4.8",
    "Pillow>=10.0",
    "tifffile>=2023.7",
]

[project.scripts]
lenticular2 = "lenticular2.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["lenticular2*"]
