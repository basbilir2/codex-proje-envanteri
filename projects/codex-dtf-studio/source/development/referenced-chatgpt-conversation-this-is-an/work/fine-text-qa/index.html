<!doctype html><html lang="tr"><meta charset="utf-8"><button id="open">Mavi örneğini aç</button><button id="select">EST alanını seç</button><button id="check">Geri almayı denetle</button><output id="status"></output><dtf-studio></dtf-studio><script type="module" src="dtf-studio.js"></script><script type="module">
const app=document.querySelector('dtf-studio'),status=document.querySelector('#status');let baseline;
document.querySelector('#open').onclick=async()=>{const blob=await(await fetch('mavi.png')).blob();await app.run(async()=>{await app.addFiles([new File([blob],'Mavi.png',{type:'image/png'})],false);const d=app.designs[0];d.sourceW=336;d.sourceH=193;d.aiScale=2;await app.tool(d,'inspect');});const dialog=app.shadowRoot.querySelector('dialog');for(const id of ['select','check','status'])dialog.append(document.getElementById(id));};
document.querySelector('#select').onclick=async()=>{const c=app.shadowRoot.querySelector('#photo-result'),rect=c.getBoundingClientRect(),s=Math.min(rect.width/c.width,rect.height/c.height),left=rect.left+(rect.width-c.width*s)/2,top=rect.top+(rect.height-c.height*s)/2;baseline=c.getContext('2d').getImageData(0,0,c.width,c.height).data;c.setPointerCapture=()=>{};const event=(x,y)=>({clientX:left+x*s,clientY:top+y*s,pointerId:1});c.onpointerdown(event(450,296));c.onpointermove(event(605,366));c.onpointerup(event(605,366));for(let i=0;i<100;i++){await new Promise(r=>setTimeout(r,30));const data=c.getContext('2d').getImageData(0,0,c.width,c.height).data;let changed=0,outside=0,rgb=0,outsideAlpha=0,alpha=0;for(let p=0;p<data.length;p++)if(data[p]!==baseline[p]){changed++;const k=Math.floor(p/4),x=k%c.width,y=Math.floor(k/c.width);if(x<450||x>=605||y<296||y>=366)outside++;if(p%4!==3)rgb++;else{alpha++;if(x<450||x>=605||y<296||y>=366)outsideAlpha++;}}if(changed){status.textContent=JSON.stringify({changed,outside,rgb,outsideAlpha,alpha,width:c.width,height:c.height});return;}}status.textContent='FAIL: no change';};
document.querySelector('#check').onclick=()=>{const c=app.shadowRoot.querySelector('#photo-result'),data=c.getContext('2d').getImageData(0,0,c.width,c.height).data;status.textContent='Undo restored alpha: '+data.every((v,i)=>i%4!==3||v===baseline[i]);};
</script></html>
