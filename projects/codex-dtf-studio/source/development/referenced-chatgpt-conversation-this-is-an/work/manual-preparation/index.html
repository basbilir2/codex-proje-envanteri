<!doctype html><html lang="tr"><meta charset="utf-8"><button id="qa-open">Mavi ürün fotoğrafını aç</button><dtf-studio></dtf-studio><script type="module" src="dtf-studio.js"></script><script type="module">
const app=document.querySelector('dtf-studio');document.querySelector('#qa-open').onclick=async()=>{const blob=await(await fetch('mavi.jpeg')).blob();await app.run(()=>app.addFiles([new File([blob],'Mavi sıra kontrolü.jpeg',{type:'image/jpeg'})]));const dialog=app.shadowRoot.querySelector('dialog'),box=document.createElement('div');box.innerHTML='<button id="qa-report">Aşama durumunu oku</button><output id="qa-state"></output>';dialog.append(box);box.querySelector('button').onclick=()=>{const c=app.shadowRoot.querySelector('#photo-result'),pixels=c.getContext('2d').getImageData(0,0,c.width,c.height).data;let transparent=0;for(let p=3;p<pixels.length;p+=4)if(pixels[p]<255)transparent++;box.querySelector('output').textContent=JSON.stringify({width:c.width,height:c.height,transparent,info:app.shadowRoot.querySelector('#photo-info').textContent,approvalDisabled:app.shadowRoot.querySelector('#photo-use').disabled,cleanupDisabled:app.shadowRoot.querySelector('#photo-level').disabled});};};
</script></html>
