<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Bahşiş Hesaplayıcı</title>
  <style>body{font-family:system-ui,sans-serif;max-width:34rem;margin:3rem auto;padding:1rem;color:#17202a}main{display:grid;gap:1rem}label{display:grid;gap:.35rem}input,button{font:inherit;padding:.7rem;border:1px solid #89939d;border-radius:.5rem}button{background:#145a32;color:#fff;cursor:pointer}output{padding:1rem;background:#f1f8f4;border-radius:.5rem;font-weight:700}</style>
  <script src="app.js" defer></script>
</head>
<body>
<main>
  <h1>Bahşiş Hesaplayıcı</h1>
  <label>Tutar <input id="amount" type="number" min="0" step="0.01" inputmode="decimal"></label>
  <label>Bahşiş oranı (%) <input id="rate" type="number" min="0" step="0.1" value="10"></label>
  <button id="calculate" type="button">Hesapla</button>
  <output id="result" aria-live="polite">Sonuç burada görünecek.</output>
</main>
</body>
</html>
