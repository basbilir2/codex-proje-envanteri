<script>
(()=>{'use strict';
const boot=window.ELMAS_BOOT||{},$=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),money=n=>new Intl.NumberFormat('tr-TR',{style:'currency',currency:'TRY',maximumFractionDigits:0}).format(Number(n)||0),moneyExact=n=>new Intl.NumberFormat('tr-TR',{style:'currency',currency:'TRY'}).format(Number(n)||0),date=s=>s?new Date(String(s).slice(0,10)+'T12:00:00').toLocaleDateString('tr-TR'):'—',today=()=>new Intl.DateTimeFormat('sv-SE',{timeZone:'Europe/Istanbul'}).format(new Date()),sum=(a,k)=>a.reduce((v,r)=>v+Number(r[k]||0),0),active=x=>x===true||String(x).toUpperCase()==='TRUE';
const menusAdmin=[['home','⌂','Ana Sayfa'],['apartments','▦','Daireler ve Ödemeler'],['movements','⇅','Gelir / Gider'],['cash','▣','Kasa'],['announcements','♧','Duyurular'],['reports','▥','Raporlar'],['settings','⚙','Ayarlar']],menusResident=[['home','⌂','Ana Sayfa'],['dues','▤','Borçlarım'],['payments','↔','Ödemelerim'],['pay','↗','Ödeme Yap'],['receipts','▧','Dekont Yükle'],['vouchers','▥','Makbuzlarım'],['announcements','♧','Duyurular'],['movements','⇅','Ortak Giderler'],['documents','▱','Belgeler']],menusReadOnly=[['home','⌂','Ana Sayfa'],['dues','▤','Borçlarım'],['payments','↔','Ödemelerim'],['announcements','♧','Duyurular'],['movements','⇅','Ortak Giderler']];
let S=null,route='home',detail=boot.receipt||'',apartmentFocus='',token=sessionStorage.getItem('elmas-session')||'',reportType='monthly',receiptFilter='ALL',currentBlob='',busy=false;
const admin=()=>S?.user.Rol==='YONETICI';
function rpc(fn,...args){if(boot.demo)return fetch('/rpc',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({fn,args})}).then(async r=>{const d=await r.json();if(d.error)throw Error(d.error);return d.result;});return new Promise((resolve,reject)=>google.script.run.withSuccessHandler(resolve).withFailureHandler(e=>reject(Error(e.message)))[fn](...args));}
function api(action,p={}){return rpc('api',token,action,p);}
function toast(text,error=false){const n=$('#toast');n.textContent=text;n.className=error?'error':'';n.style.display='block';clearTimeout(toast.timer);toast.timer=setTimeout(()=>n.style.display='none',6500);}
function badge(status){const m={ODENDI:['Ödendi',''],BORCLU:['Borçlu','red'],KISMI:['Kısmi ödeme','amber'],BEKLIYOR:['Onay bekliyor','amber'],ONAYLANDI:['Onaylandı',''],REDDEDILDI:['Reddedildi','red'],PASIF:['Pasif','gray'],MUAF:['Aidattan muaf','gray']},a=m[status]||[status,'gray'];return `<span class="badge ${a[1]}">● ${esc(a[0])}</span>`;}
function btn(text,action,cls='',extra=''){return `<button class="btn ${cls}" data-action="${action}" ${extra}>${text}</button>`;}
function field(name,label,value='',type='text',extra=''){return `<label class="field">${label}<input name="${name}" type="${type}" value="${esc(value)}" ${extra}></label>`;}
function select(name,label,options,value){return `<label class="field">${label}<select name="${name}">${options.map(o=>{const [v,l]=Array.isArray(o)?o:[o,o];return `<option value="${esc(v)}" ${String(v)===String(value)?'selected':''}>${esc(l)}</option>`;}).join('')}</select></label>`;}
function check(name,label,value){return `<label class="check"><input type="checkbox" name="${name}" ${active(value)?'checked':''}>${label}</label>`;}
function textarea(name,label,value='',extra=''){return `<label class="field full">${label}<textarea name="${name}" ${extra}>${esc(value)}</textarea></label>`;}
function fileField(required=true){return `<label class="field full">Dosya • PDF, JPG veya PNG (en fazla 5 MB)<input name="file" type="file" accept="application/pdf,image/jpeg,image/png" ${required?'required':''}></label>`;}
function empty(title='Henüz kayıt yok',subtitle='Yeni kayıtlar burada görünecek.'){return `<div class="empty"><strong>${title}</strong>${subtitle}</div>`;}
function table(headers,rows){return rows.length?`<div class="tablewrap"><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.map(row=>`<tr>${row.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`:empty();}
function stat(label,value,note='',featured=false){return `<div class="stat ${featured?'featured':''}"><div class="statlabel">${label}<span>↗</span></div><div class="statvalue">${value}</div><div class="statnote">${note||'&nbsp;'}</div></div>`;}
function title(h,sub,actions=''){return `<div class="pagehead"><div><h1>${h}</h1><p class="sub">${sub}</p></div><div class="actions">${actions}</div></div>`;}
function metrics(){const period=today().slice(0,7),dues=S.dues.filter(r=>String(r.Donem).slice(0,7)===period),aidat=dues.filter(r=>(r.Tur||'Aidat')==='Aidat'),cash=S.cash||[],inc=sum(cash.filter(r=>r.Tur==='GELIR'),'Tutar'),exp=sum(cash.filter(r=>r.Tur==='GIDER'),'Tutar'),monthlyExpense=sum(cash.filter(r=>r.Tur==='GIDER'&&String(r.Tarih).slice(0,7)===period&&!/gerçek tarih bilinmediğinden aktarım tarihi/i.test(String(r.Aciklama||''))),'Tutar');return {total:sum(dues,'Tutar'),paid:sum(dues,'Odenen'),debt:sum(S.dues,'Kalan'),pending:S.receipts.filter(r=>r.Durum==='BEKLIYOR'),inc,exp,balance:inc-exp,collectedDues:sum(aidat,'Odenen'),requiredDues:sum(aidat,'Kalan'),monthlyExpense,dues};}
function apartmentStatus(a){if(!active(a.Aktif))return 'PASIF';if(active(a.AidatMuaf))return 'MUAF';if(S.receipts.some(r=>r.DaireID===a.DaireID&&r.Durum==='BEKLIYOR'))return 'BEKLIYOR';if(S.dues.some(r=>r.DaireID===a.DaireID&&Number(r.Kalan)>0))return 'BORCLU';return 'ODENDI';}
function aptCards(){return `<div class="apts">${S.apartments.map(a=>{const debt=sum(S.dues.filter(r=>r.DaireID===a.DaireID),'Kalan');return `<div class="apt${active(a.Aktif)?'':' apt-passive'}" data-action="apartmentView" data-id="${esc(a.DaireID)}" role="button" tabindex="0"><div class="aptop"><span class="aptnum">Daire ${a.DaireNo}${active(a.Aktif)?'':' — Pasif'}</span><span class="apticon">▥</span></div><div class="aptname">${esc(a.Kiraci||a.Malik||'Sakin bilgisi eklenmedi')}</div><div class="aptdebt">${moneyExact(debt)} borç</div>${badge(active(a.Aktif)?apartmentStatus(a):'PASIF')}${!active(a.Aktif)&&admin()?`<div style="margin-top:8px">${btn('Aktif et','activateApt','small soft',`data-id="${esc(a.DaireID)}"`)}</div>`:''}</div>`;}).join('')}</div>`;}
function announcementCards(limit=99){return S.announcements.slice().reverse().slice(0,limit).map(a=>`<article class="notice"><h3>${active(a.Onemli)?'● ':''}${esc(a.Baslik)}</h3><p>${esc(a.Metin)}</p><small>${date(a.Tarih)} ${active(a.Onemli)?'• Önemli duyuru':''}</small></article>`).join('')||empty('Henüz duyuru yok','Yönetim duyuruları burada yayınlanır.');}
function cashDetail(r){let detail=esc(r.Aciklama||'Açıklama girilmedi.'),share='';if(r.Tur==='GIDER'&&Number(r.Tutar)>=1000){const candidates=(S.cash||[]).filter(x=>x.Tur==='GELIR'&&x.Kategori===r.Kategori),source=candidates.find(x=>/(\d+)\s*daireden\s*([\d.]+(?:,\d+)?)\s*TL/i.test(x.Aciklama||''))||candidates.find(x=>/Daire\s*1\s*[–-]\s*(\d+)/i.test(x.Aciklama||''));if(source){let m=String(source.Aciklama).match(/(\d+)\s*daireden\s*([\d.]+(?:,\d+)?)\s*TL/i);if(m)share=`${m[1]} daire katılımı • Daire başı ${moneyExact(Number(m[2].replace(/\./g,'').replace(',','.')))}`;else{m=String(source.Aciklama).match(/Daire\s*1\s*[–-]\s*(\d+)/i);if(m)share=`${m[1]} daire katılımı • Daire başı ${moneyExact(Number(r.Tutar)/Number(m[1]))}`;}}}return `<b>${esc(r.Kategori)} ${r.Tur==='GIDER'?'gideri':'tahsilatı'}</b><div class="muted" style="font-size:11px;margin-top:5px;white-space:normal;line-height:1.55">Toplam ${moneyExact(r.Tutar)}${share?' • '+share:''} • ${date(r.Tarih)}<br>${detail}</div>`;}
function cashTable(rows){const manage=admin(),headers=['İŞLEM DETAYI','TARİH','TUTAR'];if(manage)headers.push('İŞLEM');return table(headers,rows.map(r=>{const cells=[cashDetail(r),date(r.Tarih),`<span class="money ${r.Tur==='GELIR'?'positive':'negative'}">${r.Tur==='GELIR'?'+':'−'}${moneyExact(r.Tutar)}</span>`];if(manage){const editable=S.movements.some(x=>x.HareketID===r.HareketID);cells.push(editable?btn('Düzenle','movementEdit','small',`data-id="${esc(r.HareketID)}"`):'');}return cells;}));}
function shell(content){const menus=admin()?menusAdmin:S.readonly?menusReadOnly:menusResident,label=route==='apartments'&&apartmentFocus?'Daire detayı':menus.find(m=>m[0]===route)?.[2]||'Ana Sayfa',bottom=admin()?['home','apartments','cash','settings']:S.readonly?['home','dues','payments','movements']:['home','dues','receipts','vouchers'];$('#app').innerHTML=`<aside class="sidebar"><div class="brand"><span class="brandmark">◇</span><div>ELMAS<small>APARTMANI</small></div></div><div class="navcaption">${admin()?'YÖNETİM PANELİ':'SAKİN PANELİ'}</div><nav class="nav">${menus.map(([r,i,n])=>`<button data-route="${r}" class="${r===route?'active':''}"><span class="ico">${i}</span>${n}${r==='receipts'&&metrics().pending.length?`<span class="count">${metrics().pending.length}</span>`:''}</button>`).join('')}</nav><div class="sidefoot"><div class="avatar">${esc(S.user.AdSoyad.slice(0,1))}</div><div><b style="font-size:12px">${esc(S.user.AdSoyad)}</b><small>${admin()?'Apartman yöneticisi':S.user.DaireID+' sakini'}</small></div>${S.readonly||boot.desktop?'':`<button class="logout" data-action="logout" title="Çıkış yap">↪</button>`}</div></aside><main class="main">${boot.demo&&!boot.desktop?'<div class="demo-banner">ÖNİZLEME • Örnek veriler kullanılır. Google hesabına bağlı değildir; bildirim göndermez.</div>':''}<header class="topbar"><div class="crumb"><button class="mobilemenu" data-action="menu" aria-label="Menüyü aç">☰</button><span>Elmas Apartmanı /</span><b>${label}</b></div><div class="topright"><span class="date">${new Date().toLocaleDateString('tr-TR',{day:'numeric',month:'long',year:'numeric'})}</span><span class="live">${admin()?'Yönetici':S.readonly?'Salt okunur sakin bağlantısı':'Sakin'}</span>${boot.demo&&!boot.desktop?btn(admin()?'Sakin görünümü':'Yönetici görünümü','switch','small'):''}</div></header><div class="content">${content}</div></main><nav class="bottomnav">${bottom.map(r=>{const m=menus.find(x=>x[0]===r);return `<button data-route="${r}" class="${route===r?'active':''}"><span class="ico">${m[1]}</span>${r==='receipts'?'Dekontlar':m[2]}</button>`;}).join('')}<button data-action="menu"><span class="ico">☰</span>Menü</button></nav>`;}
function render(){if(!S)return;const pages={home,apartments,dues,payments,receipts,movements,cash,vouchers,announcements,documents,reports,settings,pay};const menus=admin()?menusAdmin:S.readonly?menusReadOnly:menusResident;if(!admin()&&!menus.some(m=>m[0]===route))route='home';shell((pages[route]||home)());if(route==='receipts'&&detail)loadPreview(detail);}
async function load(){S=await api('bootstrap');if(detail&&S.receipts.some(d=>d.DekontID===detail))route='receipts';render();}
function login(){$('#app').innerHTML=`<div class="login"><div class="loginbox"><div class="brand"><span class="brandmark">◇</span><div>ELMAS<small>APARTMANI</small></div></div><h1>Apartmanınız, bir arada.</h1><p class="sub">Aidatlarınızı takip edin, dekontunuzu yükleyin ve apartmanınızdan haberdar olun.</p><form data-form="codeLogin"><div class="formgrid">${field('Email','Google e-posta adresiniz','','email','required autocomplete="username"')}${field('AccessCode','Şifreniz','','password','required minlength="8" autocomplete="current-password"')}</div><div class="formfoot"><button class="btn primary" type="submit">Giriş yap</button></div></form><button class="btn soft" style="width:100%;margin-top:10px" data-action="initialPassword">İlk giriş: şifremi oluştur</button><p class="hint">İlk kez giriş yapan yönetici kendi şifresini oluşturur. Sakinler, yöneticinin tanımladığı giriş bilgisini kullanır.</p><div id="loginStatus"></div></div></div>`;}
async function googleLogin(){const bytes=crypto.getRandomValues(new Uint8Array(32)),secret=Array.from(bytes,b=>b.toString(16).padStart(2,'0')).join(''),digest=Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(secret))),b=>b.toString(16).padStart(2,'0')).join(''),info=await rpc('beginLogin',digest);$('#loginStatus').innerHTML=`<p><a class="btn soft" target="_blank" rel="noopener" href="${esc(info.url)}">Google giriş penceresini aç ↗</a></p><p class="sub">Giriş tamamlanınca bu ekran otomatik açılır.</p>`;let attempts=0;const timer=setInterval(async()=>{try{if(++attempts>120){clearInterval(timer);return;}const result=await rpc('finishLogin',info.id,secret);if(result.token){clearInterval(timer);token=result.token;sessionStorage.setItem('elmas-session',token);await load();}}catch(e){clearInterval(timer);toast(e.message,true);}},3000);}
/* PAGES */
function home(){const m=metrics(),month=new Date().toLocaleDateString('tr-TR',{month:'long',year:'numeric'}),apartmentCount=S.apartments.filter(a=>active(a.Aktif)).length;if(!admin())return residentHome();return title('Apartmanına genel bakış',`Her şey yolunda, ${esc(S.user.AdSoyad)}. İşte apartmanın güncel durumu.`,btn('＋ Gelir / gider ekle','movement','primary'))+`<div class="stats">${stat('Mevcut kasa',money(m.balance),'Güncel bakiye',true)}${stat('Aylık toplanan aidat',money(m.collectedDues),'Bu ay kaydedilen aidat')}${stat('Aylık toplanması gereken aidat',money(m.requiredDues),'Peşin ödemeler düşüldükten sonra')}${stat('Aylık genel gider',money(m.monthlyExpense),'Bu ayın kayıtlı giderleri')}</div><div class="two"><section class="card"><div class="cardhead"><div><h2>Dairelerin durumu</h2><small>${month} • ${apartmentCount} aktif daire</small></div><button class="textbtn" data-route="apartments">Tüm daireler ↗</button></div>${aptCards()}<div class="legend"><span>Ödendi</span><span>Onay bekliyor</span><span>Borçlu</span></div></section><section class="card"><div class="cardhead"><h2>Tahsilat özeti</h2><small>${month}</small></div><div class="progressbox"><div class="progresslabels"><span>Aylık aidat tahsilatı</span><b>%${m.total?Math.round(m.paid/m.total*100):0}</b></div><div class="progress"><div style="width:${m.total?Math.min(100,m.paid/m.total*100):0}%"></div></div><p class="progressnote">${money(m.total)} aidatın ${money(m.paid)} tutarı tahsil edildi.</p></div><div class="cardhead" style="margin-bottom:0"><h3>Onay bekleyen dekontlar</h3><span class="badge amber">${m.pending.length} yeni</span></div>${m.pending.slice(0,3).map(d=>`<div class="reviewline"><span class="fileicon">▧</span><div><b>Daire ${esc(d.DaireID.replace('D',''))}</b><small>${date(d.YuklemeTarihi)} • ${d.DosyaTipi==='application/pdf'?'PDF dekont':'Görsel dekont'}</small></div><div class="value"><b>${money(d.BeyanTutar)}</b><small>Kontrol bekliyor</small></div><button data-action="review" data-id="${esc(d.DekontID)}" aria-label="Dekontu incele">↗</button></div>`).join('')||empty('Tüm dekontlar güncel','Bekleyen onay bulunmuyor.')}<div class="hint">ⓘ Dekontlar, yönetici onayından sonra borçtan düşülür.</div></section></div><div class="two"><section class="card"><div class="cardhead"><h2>Son kasa hareketleri</h2><button class="textbtn" data-route="cash">Tüm hareketler ↗</button></div>${cashTable(S.cash.slice().reverse().slice(0,4))}</section><section class="card"><div class="cardhead"><h2>Apartmandan haberler</h2><button class="textbtn" data-route="announcements">Tümü ↗</button></div>${announcementCards(2)}</section></div>`;}
function residentHome(){const m=metrics(),a=S.apartments[0],ab=S.anonymousBuilding||{};return title('Merhaba, '+esc(S.user.AdSoyad),`Daire ${esc(a?.DaireNo||'')} • Aidatlarınız ve apartmanınızdan haberler`,S.readonly?'':btn('Ödeme yap ↗','gotoPay','primary'))+`<div class="stats">${stat('Güncel borcunuz',money(m.debt),'Tüm dönemlerin toplamı',true)}${stat('Bu ayki aidat',money(m.total),'Güncel dönem')}${stat('Son tahsilat',money(S.payments.at(-1)?.Tutar),date(S.payments.at(-1)?.Tarih))}${stat('Bina toplam aidatı',money(ab.totalDues),'Tüm dönemler')}${stat('Bina tahsilatı',money(ab.totalPaid),'Tüm dönemler')}${stat('Bina toplam borcu',money(ab.totalDebt),'Anonim — tüm daireler')}${stat('Apartman kasası',money(ab.cashBalance),'Güncel bakiye')}</div><div class="two"><section class="card"><div class="cardhead"><h2>Borçlarım</h2></div>${duesTable(S.dues)}</section><section class="card"><div class="cardhead"><h2>Duyurular</h2></div>${announcementCards(3)}</section></div>`;}
function duesTable(rows,manage=false){const headers=['DÖNEM','TÜR','TUTAR','ÖDENEN','KALAN','DURUM'];if(manage)headers.push('İŞLEM');return table(headers,rows.slice().reverse().map(r=>{const attrs=`data-id="${esc(r.AidatID)}"`,status=manage&&Number(r.Kalan)>0?`<span data-action="markDuePaid" ${attrs} title="Tek tıkla ödendi olarak kaydet" style="cursor:pointer">${badge(r.Durum)}</span>`:badge(r.Durum),cells=[esc(r.Donem),esc(r.Tur||'Aidat'),moneyExact(r.Tutar),moneyExact(r.Odenen),`<b>${moneyExact(r.Kalan)}</b>`,status];if(manage)cells.push(`<div class="actions">${btn('Düzenle','dueEdit','small',attrs)}${btn('Sil','dueDelete','small danger',attrs)}</div>`);return cells;}));}
function dues(){return title(admin()?'Aidatlar':'Borçlarım','Kısmi ödemeler, en eski borçtan başlayarak düşülür.',admin()?btn('Aidatları oluştur','generateDues','primary'):'')+`<section class="card">${duesTable(S.dues)}</section>`;}
function apartments(){if(apartmentFocus){const a=S.apartments.find(x=>x.DaireID===apartmentFocus);if(a)return apartmentPage(a);apartmentFocus='';}return title('Daireler ve ödemeler','Bir daireyi seçerek borç, ödeme, dekont ve makbuzlarını yönetin.',btn('＋ Daire ekle','apartmentAdd','primary'))+`<section class="card">${aptCards()}</section><section class="card" style="margin-top:24px"><div class="cardhead"><h2>Ortak belgeler</h2>${btn('＋ Belge yükle','document','small soft')}</div>${documentList(S.documents)}</section>`;}
function apartmentPage(a){const dues=S.dues.filter(r=>r.DaireID===a.DaireID),payments=S.payments.filter(r=>r.DaireID===a.DaireID),receipts=S.receipts.filter(r=>r.DaireID===a.DaireID),vouchers=S.vouchers.filter(r=>r.DaireID===a.DaireID),debt=sum(dues,'Kalan');const aptAttrs=`data-id="${esc(a.DaireID)}"`;const actions=btn('← Dairelere dön','apartmentBack')+(active(a.Aktif)?btn('Düzenle','apartmentEdit','soft',aptAttrs)+btn('Pasife al','apartmentDelete','danger',aptAttrs):btn('Aktif et','activateApt','soft',aptAttrs))+(debt>0?btn('📄 Borç PDF','makeDebtPDF','small soft',aptAttrs):'')+btn('🔗 Sakin linki','genResidentLink','small soft',aptAttrs);return title('Daire '+esc(a.DaireNo),esc(a.Kiraci||a.Malik||'Sakin bilgisi eklenmedi'),actions)+`<div class="stats compactstats">${stat('Güncel borç',money(debt),'Toplam kalan borç',true)}${stat('Toplam ödeme',money(sum(payments,'Tutar')))}${stat('Dekont',String(receipts.length))}${stat('Makbuz',String(vouchers.length))}</div><section class="card"><div class="cardhead"><h2>Borç ve aidatlar</h2>${btn('＋ Borç ekle','dueAdd','small primary',aptAttrs)}</div>${duesTable(dues,true)}</section><div class="two" style="margin-top:24px"><section class="card"><div class="cardhead"><h2>Ödemeler</h2></div>${table(['TARİH','TUTAR','DURUM','MAKBUZ'],payments.slice().reverse().map(r=>[date(r.Tarih),moneyExact(r.Tutar),badge(r.Durum),r.MakbuzID?btn('Aç','file','small',`data-kind="voucher" data-id="${esc(r.MakbuzID)}"`):'Aktarım özeti']))}</section><section class="card"><div class="cardhead"><h2>Dekontlar</h2>${btn('＋ Dekont','upload','small soft')}</div>${table(['TARİH','TUTAR','DURUM',''],receipts.slice().reverse().map(r=>[date(r.YuklemeTarihi),moneyExact(r.BeyanTutar),badge(r.Durum),btn('İncele','review','small',`data-id="${esc(r.DekontID)}"`)]))}</section></div><section class="card"><div class="cardhead"><h2>Makbuzlar</h2></div>${table(['NO','TARİH','AÇIKLAMA','TUTAR','PDF'],vouchers.slice().reverse().map(r=>[esc(r.MakbuzNo),date(r.Tarih),esc(r.Aciklama),moneyExact(r.Tutar),btn('PDF aç','file','small',`data-kind="voucher" data-id="${esc(r.MakbuzID)}"`)]))}</section>`;}
function documentList(rows){return table(['BELGE','KATEGORİ','TARİH','ERİŞİM',''],rows.slice().reverse().map(d=>[esc(d.Baslik),esc(d.Kategori),date(d.Tarih),active(d.SakinlereAcik)?'Sakinlere açık':'Yalnız yönetici',btn('Aç','file','small',`data-kind="document" data-id="${esc(d.BelgeID)}"`)]));}
function payments(){return title(admin()?'Ödemeler':'Ödemelerim','Yönetici tarafından onaylanmış tahsilatlar.')+`<section class="card">${table(['DAİRE','TARİH','TUTAR','DURUM','MAKBUZ'],S.payments.slice().reverse().map(r=>[esc(r.DaireID),date(r.Tarih),`<b>${moneyExact(r.Tutar)}</b>`,badge(r.Durum),S.readonly?'Kayıtlı':btn('Makbuzu aç ↗','file','small',`data-kind="voucher" data-id="${esc(r.MakbuzID)}"`)]))}</section>`;}

async function readFile(file){if(!file)return null;if(file.size>5*1024*1024)throw Error('Dosya en fazla 5 MB olabilir.');if(!['application/pdf','image/jpeg','image/png'].includes(file.type))throw Error('PDF, JPG veya PNG seçin.');const buffer=await file.arrayBuffer(),data=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(String(reader.result).split(',')[1]);reader.onerror=reject;reader.readAsDataURL(file);});return {name:file.name,type:file.type,data,buffer};}
async function pdfText(f){if(f.type!=='application/pdf')return '';try{const cdn='https:'+String.fromCharCode(47,47)+'cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/';const pdfjs=await import(cdn+'pdf.min.mjs');pdfjs.GlobalWorkerOptions.workerSrc=cdn+'pdf.worker.min.mjs';const pdf=await pdfjs.getDocument({data:new Uint8Array(f.buffer),isEvalSupported:false}).promise;let text='';try{if(pdf.numPages>20)throw Error('PDF en fazla 20 sayfa olmalı.');for(let i=1;i<=pdf.numPages;i++){const page=await pdf.getPage(i),content=await page.getTextContent();text+=content.items.map(x=>x.str+(x.hasEOL?'\n':' ')).join('')+'\n';}return text.slice(0,25000);}finally{await pdf.destroy();}}catch(e){if(e.message.includes('20 sayfa'))throw e;return '';}}
function download(name,data,type){const url=URL.createObjectURL(new Blob([data],{type})),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),30000);}
function blobURL(file){const bytes=Uint8Array.from(atob(file.data),c=>c.charCodeAt(0));return URL.createObjectURL(new Blob([bytes],{type:file.type}));}
async function loadPreview(id){try{const file=await api('getFile',{kind:'receipt',id});if(detail!==id||!$('#filePreview'))return;if(currentBlob)URL.revokeObjectURL(currentBlob);currentBlob=blobURL(file);$('#filePreview').innerHTML=file.type==='application/pdf'?`<iframe title="Orijinal dekont" src="${currentBlob}"></iframe>`:`<img alt="Yüklenen dekont" src="${currentBlob}">`;}catch(e){if($('#filePreview'))$('#filePreview').innerHTML=`<div class="errorbox">${esc(e.message)}</div>`;}}
function initialPasswordModal(){modal('İlk yönetici şifresini oluştur',`<div class="formgrid">${field('Email','Yönetici e-posta adresi','','email','required autocomplete="username"')}${field('Password','Yeni şifre','','password','required minlength="8" autocomplete="new-password"')}${field('Confirmation','Yeni şifre tekrar','','password','required minlength="8" autocomplete="new-password"')}</div><div class="hint">Bu işlem yalnızca şifresi henüz oluşturulmamış ilk yönetici hesabında bir kez çalışır.</div>`,'initialPassword');}
document.addEventListener('keydown',e=>{const b=e.target.closest('[role="button"][data-action]');if(b&&(e.key==='Enter'||e.key===' ')){e.preventDefault();b.click();}});
document.addEventListener('click',async e=>{const b=e.target.closest('[data-route],[data-action]');if(!b)return;if(b.dataset.route){route=b.dataset.route;detail='';apartmentFocus='';render();window.scrollTo(0,0);return;}const a=b.dataset.action,id=b.dataset.id;try{switch(a){case'menu':$('.sidebar').classList.toggle('open');break;case'close':$('#modal').close();break;case'initialPassword':initialPasswordModal();break;case'login':await googleLogin();break;case'logout':await rpc('logout',token);token='';sessionStorage.removeItem('elmas-session');S=null;login();break;case'switch':token=admin()?'demo-resident':'demo-admin';sessionStorage.setItem('elmas-session',token);detail='';apartmentFocus='';route='home';await load();break;case'importBackup':{const input=document.createElement('input');input.type='file';input.accept='.json,application/json';input.onchange=async()=>{try{const file=input.files[0];if(!file)return;const result=await rpc('desktopImportBackup',await file.text());await load();toast('Yedek içe aktarıldı. Önceki yerel kayıt ayrıca korundu.');}catch(err){toast(err.message,true);}};input.click();break;}case'syncNow':{b.disabled=true;const result=await rpc('desktopSync');toast(result.message,!result.ok);break;}case'ledgerImport':ledgerImportModal();break;case'apartmentView':apartmentFocus=id;route='apartments';render();window.scrollTo(0,0);break;case'apartmentBack':apartmentFocus='';render();break;case'apartmentAdd':apartmentModal();break;case'apartmentEdit':apartmentModal(id);break;case'apartmentDelete':modal('Daireyi pasife al',`<input type="hidden" name="id" value="${esc(id)}"><p class="sub">Dairenin geçmiş kayıtları korunur ve yeni aidat oluşturulmaz.</p>`,'deleteApartment');break;case'activateApt':modal('Daireyi aktif et',`<input type="hidden" name="id" value="${esc(id)}"><p class="sub">Daire tekrar aktif edilecek ve aidat oluşturulacak.</p>`,'activateApartment');break;case'makeDebtPDF':{b.disabled=true;const r=await api('makeDebtPDF',{DaireID:id}),url=blobURL(r),link=document.createElement('a');link.href=url;link.download=r.name;link.click();setTimeout(()=>URL.revokeObjectURL(url),30000);toast('Borç PDF indirildi ve Drive Raporlar klasörüne kaydedildi.');break;}case'genResidentLink':{b.disabled=true;const r=await api('generateResidentLink',{DaireID:id});modal('Sakin Linki',`<p class="sub">Bu link sakin tarafından giriş yapmadan kullanılabilir. Yeni link üretilince eskisi geçersiz olur.</p><input class="field" style="width:100%" value="${esc(r.url)}" readonly onclick="this.select()"><p class="hint">${esc(r.expiresNote)}</p>`,'noop');$('#modal .formfoot').remove();break;}case'markDuePaid':{b.disabled=true;const r=await api('markDuePaid',{id});await load();toast(moneyExact(r.amount)+' ödendi olarak kaydedildi.');break;}case'dueAdd':dueModal('',id);break;case'dueEdit':dueModal(id);break;case'dueDelete':modal('Borcu sil',`<input type="hidden" name="id" value="${esc(id)}"><p class="sub">Ödeme bağlı olmayan bu borç kaydı silinecek.</p>`,'deleteDue');break;case'user':userModal(id);break;case'movement':movementModal();break;case'movementEdit':movementModal(id);break;case'upload':uploadModal();break;case'gotoPay':route='pay';render();break;case'copy':await navigator.clipboard.writeText(b.dataset.value);toast('Kopyalandı.');break;case'review':detail=id;route='receipts';render();window.scrollTo(0,0);break;case'receiptBack':detail='';if(apartmentFocus)route='apartments';render();break;case'receiptFilter':receiptFilter=id;render();break;case'reject':modal('Dekontu reddet',`<input type="hidden" name="id" value="${esc(id)}"><div class="formgrid">${select('Neden','Red nedeni',['Yanlış tutar','Yanlış dekont','Yanlış IBAN','Okunamıyor','Mükerrer işlem','Diğer'],'Yanlış tutar')}${textarea('Aciklama','Ek açıklama')}</div>`,'reject');break;case'announcement':modal('Duyuru oluştur',`<div class="formgrid">${field('Baslik','Başlık','','text','required')}${textarea('Metin','Duyuru metni','','required')}${check('Onemli','Önemli duyuru',false)}</div>`,'announcement');break;case'document':modal('Belge yükle',`<div class="formgrid">${field('Baslik','Başlık','','text','required')}${select('Kategori','Kategori',['Fatura','Sözleşme','Tutanak','Genel'],'Genel')}${fileField()}${check('SakinlereAcik','Sakinler görebilsin',false)}</div>`,'document');break;case'file':{b.disabled=true;const f=await api('getFile',{kind:b.dataset.kind,id});const url=blobURL(f);modal(esc(f.name),`<p><a class="btn primary" href="${url}" target="_blank" rel="noopener">Dosyayı görüntüle ↗</a> <a class="btn" href="${url}" download="${esc(f.name)}">İndir</a></p>`,'noop');$('#modal .formfoot').remove();setTimeout(()=>URL.revokeObjectURL(url),300000);break;}case'generateDues':{b.disabled=true;const r=await api('generateDues');await load();toast(r.count+' yeni aidat oluşturuldu. Mevcut kayıtlar korundu.');break;}case'deleteMovement':modal('Hareketi iptal et',`<input type="hidden" name="id" value="${esc(id)}"><p class="sub">Bu kayıt ters kasa hareketiyle iptal edilir. İşlem geçmişi korunur.</p>`,'deleteMovement');break;case'retryNotification':{const r=await api('retryNotification',{id});await load();toast(r.status);break;}case'backup':{b.disabled=true;const r=await api('backup');download(r.name,r.json,'application/json');toast('JSON yedeği hazırlandı ve indirildi.');break;}case'print':window.print();break;case'exportReport':{const r=reportData(),csv='\uFEFF'+[r.headers,...r.rows].map(row=>row.map(v=>{let s=String(v??'');if(/^[=+@\-\t\r]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"';}).join(';')).join('\r\n');download('elmas-'+reportType+'.csv',csv,'text/csv;charset=utf-8');break;}}}catch(err){toast(err.message,true);}finally{b.disabled=false;}});
document.addEventListener('change',e=>{if(e.target.name==='reportType'){reportType=e.target.value;$('#reportResult').innerHTML=reportContent();}if(e.target.name==='reportPeriod')$('#reportResult').innerHTML=reportContent();if(e.target.name==='Tur'&&e.target.form?.dataset.form==='due'){const box=e.target.form.querySelector('[data-other-debt]'),input=box.querySelector('input'),show=e.target.value==='Diğer';box.style.display=show?'':'none';input.required=show;if(!show)input.value='';}});
document.addEventListener('submit',async e=>{const form=e.target.closest('[data-form]');if(!form)return;e.preventDefault();if(busy)return;busy=true;const button=form.querySelector('[type=submit]'),old=button?.textContent;if(button){button.disabled=true;button.textContent='İşleniyor…';}try{const data=Object.fromEntries(new FormData(form));form.querySelectorAll('[type=checkbox]').forEach(n=>data[n.name]=n.checked);const kind=form.dataset.form;delete data.file;
 if(kind==='codeLogin'){const result=await rpc('loginWithCode',data.Email,data.AccessCode);token=result.token;sessionStorage.setItem('elmas-session',token);await load();return;}
 if(kind==='initialPassword'){const result=await rpc('createInitialAdminPassword',data.Email,data.Password,data.Confirmation);token=result.token;sessionStorage.setItem('elmas-session',token);$('#modal').close();await load();toast('Şifreniz oluşturuldu.');return;}
 if(['upload','document','movement'].includes(kind)){const input=form.querySelector('[type=file]'),f=input?await readFile(input.files[0]):null;if(f){if(kind==='upload'){if(button)button.textContent='Dekont okunuyor…';data.text=await pdfText(f);}delete f.buffer;data.file=f;}}
 const action={upload:'uploadReceipt',approve:'approve',reject:'reject',movement:'saveMovement',updateMovement:'updateMovement',announcement:'saveAnnouncement',document:'saveDocument',ledgerImport:'importLedger',apartment:'saveApartment',due:'saveDue',deleteApartment:'deleteApartment',deleteDue:'deleteDue',user:'saveUser',settings:'saveSettings',deleteMovement:'deleteMovement',activateApartment:'activateApartment'}[kind];if(!action)return;const result=await api(action,data);$('#modal').close();if(kind==='deleteApartment')apartmentFocus='';if(kind==='activateApartment'){apartmentFocus=data.id;}await load();toast(kind==='approve'?'Ödeme onaylandı. Makbuz: '+(result.number||'Önceden oluşturuldu'):kind==='upload'?'Dekont kaydedildi. Yönetici onayı bekleniyor.':kind==='ledgerImport'?'Aktarım tamamlandı: '+result.apartments+' daire, '+result.dues+' aidat, toplam borç '+moneyExact(result.receivable)+'.':kind==='deleteApartment'?'Daire pasife alındı.':kind==='activateApartment'?'Daire aktif edildi.':kind==='deleteDue'?'Borç silindi.':'Kaydedildi.');}catch(err){toast(err.message,true);}finally{busy=false;if(button){button.disabled=false;button.textContent=old;}}});
async function start(){if(boot.residentLink){$('#app').innerHTML='<div class="loading">Elmas Apartmanı yükleniyor…</div>';try{S=await rpc('residentLinkSnapshot',boot.residentLink);history.replaceState({},'',location.pathname);render();}catch(e){login();toast(e.message,true);}return;}if(boot.demo&&!token){token='demo-admin';sessionStorage.setItem('elmas-session',token);}if(token){$('#app').innerHTML='<div class="loading">Elmas Apartmanı yükleniyor…</div>';try{await load();}catch(e){login();toast(e.message,true);}}else login();}start();
})();
</script>
